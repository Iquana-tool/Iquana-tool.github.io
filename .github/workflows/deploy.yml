name: Deploy site

# The published site is assembled from two sources:
#   /            the hand-written landing page (index.html + assets/)
#   /docs/       the MkDocs Material build
# Because they are combined at build time, Pages must be served from Actions
# rather than from a branch (Settings -> Pages -> Source: GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the docs toolchain
        run: pip install -r requirements-docs.txt

      - name: Build the docs
        run: mkdocs build --strict   # site_dir is _build/docs, set in mkdocs.yml

      - name: Add the landing page
        run: |
          cp index.html _build/index.html
          if [ -d assets ]; then cp -r assets _build/assets; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
